name: MyPEQ

options:
  bundleIdPrefix: com.mypeq
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: "YES"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"

targets:
  MyPEQ:
    type: application
    platform: iOS
    sources:
      - path: Sources/MyPEQ
        excludes:
          - Info.plist
          - MyPEQ.entitlements
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: MyPEQ
        PRODUCT_BUNDLE_IDENTIFIER: com.mypeq.app
        INFOPLIST_FILE: Sources/MyPEQ/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MyPEQ/MyPEQ.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MyPEQ/MyPEQ-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/Shared
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: MediaPlayer.framework
      - sdk: Network.framework
      - sdk: UniformTypeIdentifiers.framework
      - target: MyPEQExtension
        embed: true
        codeSign: false

  MyPEQExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Sources/Extension
        excludes:
          - Info.plist
          - Extension.entitlements
      - path: Sources/Shared
        excludes:
          - "AirPlayReceiverBridge.*"
    settings:
      base:
        PRODUCT_NAME: MyPEQExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.mypeq.app.extension
        INFOPLIST_FILE: Sources/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Extension/Extension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Extension/Extension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/Shared
          - $(SRCROOT)/Sources/Extension
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: MediaDevice.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework
      - sdk: ExtensionFoundation.framework

schemes:
  MyPEQ:
    build:
      targets:
        MyPEQ: all
    archive:
      config: Release
